<script>
const T=THREE,M=Math,PI=M.PI,$=i=>document.getElementById(i),R=M.random,rr=(a,b)=>a+R()*(b-a),pk=a=>a[R()*a.length|0];
const P=64,RW=16,N=6,H=N*P/2,LIM=H+RW/2+8,S=P-RW,rc=i=>-H+i*P,bc=i=>-H+P/2+i*P;
const rd=new T.WebGLRenderer({antialias:false,powerPreference:'high-performance'});rd.setPixelRatio(M.min(devicePixelRatio,1.5));document.body.prepend(rd.domElement);
const sc=new T.Scene(),FOG=0xa9c9e8;sc.background=new T.Color(FOG);sc.fog=new T.Fog(FOG,35,200);
const cam=new T.PerspectiveCamera(72,1,.12,260);cam.rotation.order='YXZ';sc.add(cam);
sc.add(new T.HemisphereLight(0xdfeeff,0x556655,.9));const sun=new T.DirectionalLight(0xfff2d0,.8);sun.position.set(80,150,60);sc.add(sun);
const PU={uS:{value:600}};
function rsz(){rd.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();PU.uS.value=innerHeight*rd.getPixelRatio()*.7}
addEventListener('resize',rsz);rsz();

/* ---------- mod state ---------- */
const mod={fly:false,god:false,inf:false};
let hintT=0;
function showHint(txt){const el=$('hint');el.textContent=txt;el.style.opacity=1;hintT=1.8}
function toggleMod(k){
 mod[k]=!mod[k];
 $('m_'+k).classList.toggle('on',mod[k]);
 $('st_'+k).textContent=mod[k]?'ON':'OFF';
 if(k=='fly'){$('flyc').style.display=mod.fly&&!inCar?'flex':'none';if(mod.fly)pl.vy=0}
 if(k=='god'&&mod.god){hp=100;dead=0;$('over').style.display='none'}
}
$('bm').onclick=e=>{e.stopPropagation();const m=$('modmenu');m.style.display=m.style.display=='block'?'none':'block'};
$('m_fly').onclick=e=>{e.stopPropagation();toggleMod('fly')};
$('m_god').onclick=e=>{e.stopPropagation();toggleMod('god')};
$('m_inf').onclick=e=>{e.stopPropagation();toggleMod('inf')};

/* ---------- textures ---------- */
function tex(w,h,f){const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);const t=new T.CanvasTexture(c);t.wrapS=t.wrapT=T.RepeatWrapping;t.anisotropy=4;return t}
const sp=(x,w,h,n)=>{for(let i=0;i<n;i++){x.fillStyle=R()<.5?'rgba(0,0,0,.14)':'rgba(255,255,255,.1)';x.fillRect(R()*w,R()*h,2,2)}};
const tRoad=tex(128,128,(x,w,h)=>{x.fillStyle='#3a3b3f';x.fillRect(0,0,w,h);sp(x,w,h,1400);x.fillStyle='#ddd';x.fillRect(0,3,w,3);x.fillRect(0,h-6,w,3);x.fillRect(8,h/2-2,70,4)});tRoad.repeat.set((N*P+RW)/16,1);
const tAsp=tex(64,64,(x,w,h)=>{x.fillStyle='#3a3b3f';x.fillRect(0,0,w,h);sp(x,w,h,500)});tAsp.repeat.set(3,3);
const tGr=tex(64,64,(x,w,h)=>{x.fillStyle='#4a8a3c';x.fillRect(0,0,w,h);for(let i=0;i<400;i++){x.fillStyle=`hsl(${95+R()*30},45%,${28+R()*14}%)`;x.fillRect(R()*w,R()*h,2,3)}});
const tCo=tex(64,64,(x,w,h)=>{x.fillStyle='#a9a9a3';x.fillRect(0,0,w,h);sp(x,w,h,300);x.strokeStyle='#7d7d78';x.lineWidth=2;x.strokeRect(0,0,w,h)});
const tWi=tex(256,256,(x,w,h)=>{x.fillStyle='#bdb8ae';x.fillRect(0,0,w,h);for(let i=0;i<4;i++)for(let j=0;j<4;j++){x.fillStyle=R()<.3?pk(['#ffe7a0','#ffd27a','#fff3c4']):pk(['#26354a','#1d2a3b','#32475f']);x.fillRect(i*64+14,j*64+8,36,44);x.fillStyle='#0004';x.fillRect(i*64+14,j*64+8,36,4)}});

/* ---------- geometry batching ---------- */
class Bt{constructor(){this.p=[];this.n=[];this.u=[];this.c=[]}
 add(g,x,y,z,col,uf){g=g.toNonIndexed();const a=g.attributes,c=new T.Color(col);for(let i=0;i<a.position.count;i++){const nx=a.normal.getX(i),ny=a.normal.getY(i),nz=a.normal.getZ(i);this.p.push(a.position.getX(i)+x,a.position.getY(i)+y,a.position.getZ(i)+z);this.n.push(nx,ny,nz);this.c.push(c.r,c.g,c.b);const q=uf?uf(a.uv.getX(i),a.uv.getY(i),nx,ny,nz):[0,0];this.u.push(q[0],q[1])}}
 box(x,y,z,w,h,d,col,uf){this.add(new T.BoxGeometry(w,h,d),x,y,z,col,uf?uf(w,h,d):0)}
 mesh(m){const g=new T.BufferGeometry(),f=(a,n)=>new T.Float32BufferAttribute(a,n);g.setAttribute('position',f(this.p,3));g.setAttribute('normal',f(this.n,3));g.setAttribute('uv',f(this.u,2));g.setAttribute('color',f(this.c,3));return new T.Mesh(g,m)}}
const winUV=(w,h,d)=>(u,v,nx,ny)=>M.abs(ny)>.5?[.02,.02]:[u*(M.abs(nx)>.5?d:w)/16,v*h/16];
const tileUV=(w,h,d)=>(u,v,nx,ny)=>M.abs(ny)>.5?[u*w/6,v*d/6]:[.1,.1];
const LM=o=>new T.MeshLambertMaterial(o),MV=LM({vertexColors:true});

/* ---------- destructibles & city ---------- */
const bS=new Bt,bG=new Bt,blds=[],trees=[],props=[],debris=[];
const matSidewalk=LM({map:tCo,vertexColors:true}),matGrass=LM({map:tGr,vertexColors:true}),matBld=LM({map:tWi,vertexColors:true}),matLamp=new T.MeshBasicMaterial();

function makeBldMesh(w,h,d,col){
 const g=new T.BoxGeometry(w,h,d).toNonIndexed(),a=g.attributes,c=new T.Color(col),uvf=winUV(w,h,d),u=[];
 for(let i=0;i<a.position.count;i++){const q=uvf(a.uv.getX(i),a.uv.getY(i),a.normal.getX(i),a.normal.getY(i));u.push(q[0],q[1])}
 g.setAttribute('uv',new T.Float32BufferAttribute(u,2));
 g.setAttribute('color',new T.Float32BufferAttribute(new Array(a.position.count*3).fill(0).map((_,k)=>k%3==0?c.r:k%3==1?c.g:c.b),3));
 return new T.Mesh(g,matBld);
}

function makeTreeMesh(h,folCol){
 const grp=new T.Group();
 const trk=new T.Mesh(new T.BoxGeometry(.55,h,.55),new T.MeshLambertMaterial({color:0x5b3d24}));
 trk.position.y=h/2;grp.add(trk);
 const crn=new T.Mesh(new T.BoxGeometry(3.1,2.8,3.1),new T.MeshLambertMaterial({color:folCol}));
 crn.position.y=h+1.25;grp.add(crn);
 return grp;
}

function makeLampMesh(){
 const grp=new T.Group();
 const st=new T.Mesh(new T.BoxGeometry(.18,5,.18),new T.MeshLambertMaterial({color:0x4a4a50}));st.position.y=2.5;
 const hd=new T.Mesh(new T.BoxGeometry(.7,.25,.7),new T.MeshBasicMaterial({color:0xfff3a8}));hd.position.y=5.05;
 grp.add(st,hd);return grp;
}

for(let i=0;i<N;i++)for(let j=0;j<N;j++){const cx=bc(i),cz=bc(j);bS.box(cx,.1,cz,S,.2,S,'#fff',tileUV);
 if((i+j*2)%5==0){bG.box(cx,.21,cz,S-6,.04,S-6,'#fff',tileUV);
  for(let k=0;k<9;k++){const x=cx+rr(-18,18),z=cz+rr(-18,18),h=rr(2.2,3.4),col=pk(['#2f7d3b','#3a8f45','#27693a']);
   const m=makeTreeMesh(h,col);m.position.set(x,.2,z);sc.add(m);
   trees.push({m,x,z,h:h+2.6,r:.75,hp:25,alive:true,col})}}
 else for(const a of[-1,1])for(const b of[-1,1]){
  const w=rr(12,18),d=rr(12,18),x=cx+a*11,z=cz+b*11,h=rr(10,28)+M.max(0,1-M.hypot(cx,cz)/230)*rr(0,85),col=pk(['#fff','#e8d9c6','#cdd9e8','#dcc8c8','#c3d3c3']);
  const m=makeBldMesh(w,h,d,col);m.position.set(x,.2+h/2,z);sc.add(m);
  blds.push({m,x,z,w,d,x0:x-w/2,x1:x+w/2,z0:z-d/2,z1:z+d/2,h:h+.2,hp:M.max(60,w*d*h*0.04),alive:true,col})}
 for(const s of[-1,1])for(const k of[-16,0,16])for(const[x,z]of[[cx+s*23.2,cz+k],[cx+k,cz+s*23.2]]){
  const lm=makeLampMesh();lm.position.set(x,.2,z);sc.add(lm);
  props.push({m:lm,x,z,r:.45,h:5.2,hp:15,alive:true,col:'#fff3a8'})}
}
sc.add(bS.mesh(matSidewalk),bG.mesh(matGrass));
const gg=new T.PlaneGeometry(1400,1400).rotateX(-PI/2),guv=gg.attributes.uv;for(let i=0;i<guv.count;i++)guv.setXY(i,guv.getX(i)*175,guv.getY(i)*175);
sc.add(new T.Mesh(gg,matGrass));
const rm=LM({map:tRoad,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2}),im=LM({map:tAsp,polygonOffset:true,polygonOffsetFactor:-4,polygonOffsetUnits:-4});
for(let i=0;i<=N;i++)for(let a=0;a<2;a++){const g=new T.PlaneGeometry(N*P+RW,RW).rotateX(-PI/2);if(a)g.rotateY(PI/2);const m=new T.Mesh(g,rm);m.position.set(a?rc(i):0,.03,a?0:rc(i));sc.add(m)}
{const ins=new T.InstancedMesh(new T.PlaneGeometry(RW,RW).rotateX(-PI/2),im,(N+1)**2),o=new T.Object3D;let q=0;for(let i=0;i<=N;i++)for(let j=0;j<=N;j++){o.position.set(rc(i),.06,rc(j));o.updateMatrix();ins.setMatrixAt(q++,o.matrix)}sc.add(ins)}

function spawnDebris(x,y,z,sx,sy,sz,col,count){
 const mat=new T.MeshLambertMaterial({color:col});
 for(let i=0;i<count;i++){
  if(debris.length>90){const old=debris.shift();sc.remove(old.m)}
  const g=new T.BoxGeometry(rr(sx*.3,sx),rr(sy*.3,sy),rr(sz*.3,sz));
  const m=new T.Mesh(g,mat);
  m.position.set(x+rr(-sx,sx),y+rr(0,sy),z+rr(-sz,sz));
  m.rotation.set(rr(0,6),rr(0,6),rr(0,6));
  sc.add(m);
  debris.push({m,vx:rr(-12,12),vy:rr(4,16),vz:rr(-12,12),rx:rr(-8,8),ry:rr(-8,8),rz:rr(-8,8),l:rr(2.2,4.2)})
 }
}

function destroyObj(obj,kind){
 if(!obj.alive)return;obj.alive=false;sc.remove(obj.m);
 if(kind=='bld'){
  spawnDebris(obj.x,obj.h*.35,obj.z,M.min(4,obj.w*.25),M.min(4,obj.h*.15),M.min(4,obj.d*.25),obj.col,24);
  for(let i=0;i<3;i++)setTimeout(()=>boom(obj.x+rr(-obj.w*.35,obj.w*.35),rr(2,M.min(35,obj.h)),obj.z+rr(-obj.d*.35,obj.d*.35)),i*110);
 }else if(kind=='tree'){
  spawnDebris(obj.x,1.5,obj.z,.7,.7,.7,obj.col,10);
  spawnDebris(obj.x,1.2,obj.z,.35,.9,.35,'#5b3d24',4);
 }else{
  spawnDebris(obj.x,2,obj.z,.4,.4,.4,obj.col,6);
 }
}

function damageObj(obj,dmgAmt,kind,hx,hy,hz){
 if(!obj||!obj.alive)return;
 obj.hp-=dmgAmt;
 if(hx!=null)for(let i=0;i<5;i++)em(hx,hy,hz,rr(-4,4),rr(1,6),rr(-4,4),.85,.78,.65,.22,.45,0,-14,.9);
 if(obj.hp<=0)destroyObj(obj,kind);
}

function blastDestructibles(x,y,z,rad,power){
 for(const b of blds)if(b.alive){
  const cx=M.max(b.x0,M.min(x,b.x1)),cz=M.max(b.z0,M.min(z,b.z1));
  const dist=M.hypot(x-cx,z-cz);
  if(dist<rad&&y<b.h+3)damageObj(b,power*(1-dist/(rad+1)),'bld',cx,M.min(y,b.h),cz);
 }
 for(const t of trees)if(t.alive){
  const dist=M.hypot(x-t.x,z-t.z);
  if(dist<rad*.9)damageObj(t,power*(1-dist/(rad+1)),'tree',t.x,1.5,t.z);
 }
 for(const p of props)if(p.alive){
  const dist=M.hypot(x-p.x,z-p.z);
  if(dist<rad*.8)damageObj(p,power,'prop',p.x,2,p.z);
 }
}

/* ---------- GTA easter eggs on map edge ---------- */
const easterEggs=[];
function makeGtaChar(name,shirt,pants,hair,accent){
 const grp=new T.Group();
 const b=new Bt;
 // тело, голова, руки, ноги + акцент (майка/куртка/шорты)
 b.box(0,.8,0,.46,.72,.28,shirt);
 b.box(0,1.42,0,.36,.36,.36,'#d89b6c');
 b.box(0,1.64,.02,.38,.12,.38,hair);
 b.box(-.34,1.12,0,.16,.58,.16,shirt);
 b.box(.34,1.12,0,.16,.58,.16,shirt);
 b.box(-.14,.24,0,.18,.48,.2,pants);
 b.box(.14,.24,0,.18,.48,.2,pants);
 if(accent)b.box(0,.98,.15,.22,.22,.05,accent);
 const m=b.mesh(MV);grp.add(m);
 // постамент пасхалки
 const ped=new T.Mesh(new T.BoxGeometry(1.4,.2,1.4),new T.MeshLambertMaterial({color:0x222634}));
 ped.position.y=.1;grp.add(ped);
 // табличка-маячок
 const sign=new T.Mesh(new T.BoxGeometry(.9,.35,.08),new T.MeshBasicMaterial({color:accent||0xffd166}));
 sign.position.set(0,2.05,0);grp.add(sign);
 return grp;
}

const GTA_LIST=[
 {name:'CJ (GTA San Andreas)',shirt:'#ffffff',pants:'#39588a',hair:'#181818',accent:'#2b8a3e',x:-LIM+6,z:-LIM+6,rot:PI*.75},
 {name:'Niko Bellic (GTA IV)',shirt:'#495057',pants:'#2b2d42',hair:'#2b1d14',accent:'#adb5bd',x:0,z:-LIM+5,rot:PI},
 {name:'Michael De Santa (GTA V)',shirt:'#5c7cfa',pants:'#343a40',hair:'#8d6e63',accent:'#ffe066',x:LIM-6,z:-LIM+6,rot:-PI*.75},
 {name:'Franklin Clinton (GTA V)',shirt:'#e03131',pants:'#212529',hair:'#141414',accent:'#ffd43b',x:-LIM+5,z:0,rot:PI/2},
 {name:'Trevor Philips (GTA V)',shirt:'#f8f9fa',pants:'#495057',hair:'#6c757d',accent:'#e8590c',x:LIM-5,z:0,rot:-PI/2},
 {name:'Jason (GTA VI)',shirt:'#74c0fc',pants:'#4c6ef5',hair:'#9c6644',accent:'#ffa94d',x:-LIM+6,z:LIM-6,rot:PI*.25},
 {name:'Lucia (GTA VI)',shirt:'#f06595',pants:'#1c1e26',hair:'#1b1b1b',accent:'#ff8787',x:LIM-6,z:LIM-6,rot:-PI*.25}
];
for(const g of GTA_LIST){
 const m=makeGtaChar(g.name,g.shirt,g.pants,g.hair,g.accent);
 m.position.set(g.x,0,g.z);m.rotation.y=g.rot;sc.add(m);
 easterEggs.push({m,...g,found:false});
}

   c.yaw+=turn*2.2*dirSign*dt;
  }
  const fx=-M.sin(c.yaw),fz=-M.cos(c.yaw);
  c.x+=fx*carSpd*dt;c.z+=fz*carSpd*dt;
  c.x=M.max(-LIM,M.min(LIM,c.x));c.z=M.max(-LIM,M.min(LIM,c.z));
  for(const b of blds)if(b.alive&&c.x>b.x0-1.5&&c.x<b.x1+1.5&&c.z>b.z0-1.5&&c.z<b.z1+1.5){
   if(M.abs(carSpd)>11){damageObj(b,M.abs(carSpd)*2.5,'bld',c.x,1.5,c.z);carSpd*=.65}
   else{c.x-=fx*carSpd*dt;c.z-=fz*carSpd*dt;carSpd*=-.2}
  }
  for(const tr of trees)if(tr.alive&&M.hypot(c.x-tr.x,c.z-tr.z)<2.1){
   damageObj(tr,M.max(15,M.abs(carSpd)*2),'tree',tr.x,1.2,tr.z);
  }
  for(const n of npcs)if(!n.st&&M.hypot(n.g.position.x-c.x,n.g.position.z-c.z)<2.3&&M.abs(carSpd)>3){
   hitN(n,fx*M.max(8,carSpd*1.1)+rr(-3,3),6+M.abs(carSpd)*.2,fz*M.max(8,carSpd*1.1)+rr(-3,3));
  }
  c.m.position.set(c.x,0,c.z);c.m.rotation.set(0,c.yaw,0);
  pl.x=c.x;pl.z=c.z;pl.y=.55;
  if(btn.f&&cd<=0){cd=.35;boom(c.x+fx*3,1.2,c.z+fz*3)}
 }else{
  const f=-jy,sx=M.sin(pl.yaw),cx=M.cos(pl.yaw),mag=M.min(1,M.hypot(jx,jy));
  const spd=mod.fly?15:7.5;
  pl.x+=((-sx*f+cx*jx)*spd+pl.kx)*dt;pl.z+=((-cx*f-sx*jx)*spd+pl.kz)*dt;
  const dk=M.min(1,2.5*dt);pl.kx-=pl.kx*dk;pl.kz-=pl.kz*dk;
  if(mod.fly){
   pl.vy=0;
   if(btn.u||btn.j)pl.y+=11*dt;
   if(btn.d)pl.y-=11*dt;
   if(pl.y<0)pl.y=0;
  }else{
   if(btn.j&&pl.y<=.01&&!dead)pl.vy=8;
   pl.vy-=22*dt;pl.y+=pl.vy*dt;if(pl.y<0){pl.y=0;pl.vy=0}
  }
  // коллизия зданий
  for(const b of blds)if(b.alive&&pl.y<b.h&&pl.x>b.x0-.5&&pl.x<b.x1+.5&&pl.z>b.z0-.5&&pl.z<b.z1+.5){
   const q=[pl.x-b.x0+.5,b.x1+.5-pl.x,pl.z-b.z0+.5,b.z1+.5-pl.z],i=q.indexOf(M.min(...q));
   if(i==0)pl.x=b.x0-.5;else if(i==1)pl.x=b.x1+.5;else if(i==2)pl.z=b.z0-.5;else pl.z=b.z1+.5}
  // коллизия деревьев (исправлено!)
  for(const tr of trees)if(tr.alive&&pl.y<tr.h){
   const dx=pl.x-tr.x,dz=pl.z-tr.z,d=M.hypot(dx,dz),minD=tr.r+.45;
   if(d<minD){const nx=d>1e-4?dx/d:1,nz=d>1e-4?dz/d:0;pl.x=tr.x+nx*minD;pl.z=tr.z+nz*minD}
  }
  // коллизия фонарей/объектов
  for(const pr of props)if(pr.alive&&pl.y<pr.h){
   const dx=pl.x-pr.x,dz=pl.z-pr.z,d=M.hypot(dx,dz),minD=pr.r+.4;
   if(d<minD){const nx=d>1e-4?dx/d:1,nz=d>1e-4?dz/d:0;pl.x=pr.x+nx*minD;pl.z=pr.z+nz*minD}
  }
  pl.x=M.max(-LIM,M.min(LIM,pl.x));pl.z=M.max(-LIM,M.min(LIM,pl.z));
  bob+=dt*10*mag;
  if(btn.f&&cd<=0&&!dead)[punch,ak,rpg][wp]();
 }

 // пасхалки GTA на краю карты
 for(const eg of easterEggs){
  eg.m.rotation.y+=dt*.7;
  if(!eg.found&&M.hypot(pl.x-eg.x,pl.z-eg.z)<5.5){
   eg.found=true;
   showHint('Пасхалка GTA: '+eg.name+'!');
  }
 }

 // обломки разрушенных объектов
 for(let i=debris.length-1;i>=0;i--){
  const db=debris[i];db.l-=dt;
  db.vy-=24*dt;db.m.position.x+=db.vx*dt;db.m.position.y+=db.vy*dt;db.m.position.z+=db.vz*dt;
  db.m.rotation.x+=db.rx*dt;db.m.rotation.y+=db.ry*dt;db.m.rotation.z+=db.rz*dt;
  if(db.m.position.y<.2){db.m.position.y=.2;db.vy*=-.35;db.vx*=.8;db.vz*=.8}
  if(db.l<=0){sc.remove(db.m);debris.splice(i,1)}
 }

 for(const c of cars){
  if(c==inCar)continue;
  if(!c.st){
   c.t+=c.dir*c.v*dt;if(M.abs(c.t)>LIM)c.t=-c.t;
   const nx=c.ax?c.c:c.t,nz=c.ax?c.t:c.c;
   let blocked=false;
   for(const b of blds)if(b.alive&&nx>b.x0-1.2&&nx<b.x1+1.2&&nz>b.z0-1.2&&nz<b.z1+1.2){blocked=true;break}
   if(!blocked)for(const tr of trees)if(tr.alive&&M.hypot(nx-tr.x,nz-tr.z)<1.9){blocked=true;break}
   if(blocked){c.dir*=-1}else{c.x=nx;c.z=nz}
   c.m.position.set(c.x,0,c.z);c.m.rotation.set(0,c.ax?(c.dir>0?0:PI):c.dir*PI/2,0);
   const fx=M.sin(c.h0),fz=M.cos(c.h0),dx=pl.x-c.x,dz=pl.z-c.z;
   if(!inCar&&M.abs(dx*fx+dz*fz)<2.7&&M.abs(dx*fz-dz*fx)<1.6&&pl.y<1.4)dmg(25,fx*16,fz*16,8)
  }else{
   c.x+=c.vx*dt;c.y+=c.vy*dt;c.z+=c.vz*dt;c.vy-=25*dt;
   if(c.y<=0){c.y=0;c.vy=c.vy<-3?-c.vy*.3:0;const k=M.max(0,1-3*dt);c.vx*=k;c.vz*=k;c.s1*=k;c.s2*=k}
   c.m.position.set(c.x,c.y,c.z);c.m.rotation.x+=c.s1*dt;c.m.rotation.z+=c.s2*dt;c.burn-=dt;
   if(c.burn>0){if(R()<.7)em(c.x+rr(-1,1),c.y+1.2,c.z+rr(-1,1),rr(-.5,.5),rr(1.5,3),rr(-.5,.5),.12,.12,.12,rr(1.5,2.5),rr(1.5,2.5),1.5,.5,.55);if(R()<.5)em(c.x+rr(-.8,.8),c.y+1,c.z+rr(-.8,.8),rr(-.3,.3),rr(1,3),rr(-.3,.3),1,rr(.4,.7),.1,rr(.8,1.4),.5,-1,2,.9)}
   else{c.st=0;c.hp=80;c.mat.color.setScalar(1);c.m.rotation.set(0,c.h0,0);c.t=-c.dir*LIM}
  }
 }

 for(const n of npcs){const g=n.g,p=g.position;
  if(!n.st){const sp=n.pan>0?6.5:1.5;if(n.pan>0)n.pan-=dt;n.t+=n.dir*sp*dt;if(M.abs(n.t)>LIM)n.t=-n.t;p.set(n.a?n.c:n.t,0,n.a?n.t:n.c);g.rotation.y=n.a?(n.dir>0?0:PI):n.dir*PI/2;
   if(M.hypot(p.x-pl.x,p.z-pl.z)<90){n.ph+=sp*dt*2.6;const s=M.sin(n.ph)*(n.pan>0?1.1:.6);n.L[0].rotation.x=s;n.L[1].rotation.x=-s;n.L[2].rotation.x=-s;n.L[3].rotation.x=s}}
  else{n.ft+=dt;n.vy-=25*dt;p.x+=n.vx*dt;p.y+=n.vy*dt;p.z+=n.vz*dt;if(p.y<.12){p.y=.12;n.vy=0;n.vx*=.85;n.vz*=.85}g.rotation.x=M.max(-1.5,-n.ft*7);if(n.ft>8){g.rotation.x=0;place(n)}}
  g.visible=M.hypot(p.x-pl.x,p.z-pl.z)<170}

 for(let i=rockets.length-1;i>=0;i--){const r=rockets[i],p=r.m.position;r.l-=dt;let ex=r.l<=0;const st=M.max(1,M.ceil(dt*50/1.2));
  for(let s=0;s<st&&!ex;s++){p.x+=r.vx*dt/st;p.y+=r.vy*dt/st;p.z+=r.vz*dt/st;ex=hitR(p)}
  em(p.x,p.y,p.z,rr(-.5,.5),rr(-.3,.8),rr(-.5,.5),.75,.75,.75,.9,1.3,1.6,.4,.6);em(p.x,p.y,p.z,0,0,0,1,.6,.1,.55,.15,-2,0,.9);
  if(ex){boom(p.x,p.y,p.z);sc.remove(r.m);rockets.splice(i,1)}}

 for(const t of trs)if(t.l>0&&(t.l-=dt)<=0)t.m.visible=false;
 if(bft>0){bft+=dt;bfl.scale.setScalar(2+bft*45);bfl.material.opacity=M.max(0,1-bft/.3);if(bft>.3){bfl.visible=false;bft=0}}
 upP(dt);
 shk=M.max(0,shk-dt*2.2);flash=M.max(0,flash-dt*1.4);kick=M.max(0,kick-kd*dt);mfT-=dt;mf.visible=mfT>0&&wp>0&&!inCar;mf.rotation.z=R()*6;mf.scale.setScalar(wp==2?3:1);
 const k=shk*.3,camY=inCar?pl.y+1.35:pl.y+1.7+M.sin(bob)*.04*(inCar?0:1);
 cam.position.set(pl.x+rr(-k,k),camY+(dead?-1.1:0)+rr(-k,k),pl.z+rr(-k,k));
 cam.rotation.set(pl.pitch,inCar?inCar.yaw:pl.yaw,dead?.9:0);
 if(!inCar){
  const mag=M.min(1,M.hypot(jx,jy));
  hands.forEach((h,i)=>{const e=i==hand?M.sin((1-kick)*PI):0;h.position.set((i?.26:-.26)*(1-.7*e),-.28+.1*e+M.sin(bob)*.008,-.55-.6*e)});
  const g=wg[wp];if(wp){g.position.set(M.cos(bob*.5)*.008*mag,M.sin(bob)*.008*mag,kick*.1);g.rotation.x=kick*.12}
 }
 $('hpf').style.width=hp+'%';$('red').style.opacity=mod.god?0:M.max(flash,hp<30&&!dead?.25+.1*M.sin(bob+performance.now()/200):0)}

reset();let last=performance.now(),fc=0,ft=0;
function loop(now){requestAnimationFrame(loop);const raw=(now-last)/1000;last=now;fc++;ft+=raw;if(ft>=.5){$('fps').textContent=M.round(fc/ft)+' FPS';fc=0;ft=0}
 if(innerHeight>innerWidth)return;step(M.min(raw,.05));rd.render(sc,cam)}
requestAnimationFrame(loop);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
